[project]
name = "expense-tracker"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
expense = "expense_tracker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_tracker"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]